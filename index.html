<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0a0a0a; }

  * { box-sizing: border-box; }
  a { color: inherit; }
  input::placeholder, textarea::placeholder { color: #6b6b6b; }
  input:focus, textarea:focus { border-color: #7cff9b !important; }
  @keyframes v-blink { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }
  @keyframes vg-drift {
    0%   { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); }
    25%  { transform: translate(-50%, -50%) scale(1.02) rotate(4deg); }
    50%  { transform: translate(-50%, -50%) scale(1.04) rotate(0deg); }
    75%  { transform: translate(-50%, -50%) scale(1.02) rotate(-4deg); }
    100% { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); }
  }
  @keyframes vg-glow {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }
  @keyframes v-kenburns {
    0%   { transform: scale(1.08) translate3d(0, 0, 0); }
    50%  { transform: scale(1.18) translate3d(-1.5%, -1%, 0); }
    100% { transform: scale(1.08) translate3d(0, 0, 0); }
  }
  .hero-bg {
    position: relative;
    isolation: isolate;
    background: #0a0a0a;
  }
  .hero-bg::before {
    content: '';
    position: absolute;
    inset: -6% -4%;
    background-image: url('assets/hero-bg.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transform-origin: center 40%;
    animation: v-kenburns 38s ease-in-out infinite;
    will-change: transform;
    z-index: 0;
    /* parallax offset written by JS → --py */
    translate: 0 var(--py, 0px);
  }
  .hero-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0.45) 0%, rgba(10,10,10,0.35) 40%, rgba(10,10,10,0.75) 88%, #0a0a0a 100%);
    z-index: 1;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-bg::before { animation: none; }
  }
  .stack-chip:hover {
    background: rgb(124, 255, 155) !important;
    border-color: rgb(124, 255, 155) !important;
    color: #0a0a0a !important;

  .stack-chip:hover svg { stroke: #0a0a0a !important; }
  .cert-card:hover { border-color: #7cff9b !important; background: #131313 !important; transform: translateY(-2px); }
  .work-card:hover {

  .work-card:hover::after { color: #7cff9b; transform: translate(2px, -2px); }

/* Parallax scroll for .hero-bg ::before — GPU-friendly via CSS var */
(function init() {
  const hero = document.querySelector('.hero-bg');
  if (!hero) { requestAnimationFrame(init); return; }
  let ticking = false;
  const PARALLAX_RATE = 0.35; // lower = subtler
  const onScroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const rect = hero.getBoundingClientRect();
      // Only compute while hero is in/near viewport
      if (rect.bottom > -100 && rect.top < window.innerHeight + 100) {
        const offset = -rect.top * PARALLAX_RATE;
        hero.style.setProperty('--py', offset.toFixed(1) + 'px');
      }
      ticking = false;
    });
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
