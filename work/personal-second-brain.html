<title>Personal Second Brain — Worawalan</title>
<meta name="description" content="Case study: Let Claude read my Obsidian vault natively. Custom MCP server with 27 tools for semantic search and agentic knowledge retrieval." />

<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0a0a0a; scroll-behavior: smooth; }
  body {
    font-family: 'Geist', 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: #d4d4d4;
  }
  html[lang="th"] body { font-family: 'IBM Plex Sans Thai', 'Geist', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  a { color: inherit; }
  @media (max-width: 1024px) and (min-width: 861px) {
    .cs-body-grid { grid-template-columns: 140px 1fr !important; gap: 32px !important; }
  }
  @media (max-width: 860px) {
    .cs-body-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
    .cs-glance { grid-template-columns: repeat(2, 1fr) !important; }
    .cs-tools-grid { grid-template-columns: 1fr !important; }
    .cs-security-grid { grid-template-columns: 1fr !important; }
  }
  @keyframes v-pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px #7cff9b, 0 0 0 0 rgba(124,255,155,0.55); }
    50%      { opacity: 0.55; box-shadow: 0 0 10px #7cff9b, 0 0 0 6px rgba(124,255,155,0); }
  }
  @keyframes vg-drift {
    0%   { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); }
    25%  { transform: translate(-50%, -50%) scale(1.02) rotate(4deg); }
    50%  { transform: translate(-50%, -50%) scale(1.04) rotate(0deg); }
    75%  { transform: translate(-50%, -50%) scale(1.02) rotate(-4deg); }
    100% { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); }
  }
  @keyframes vg-glow {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }
  /* lightbox */
  .cs-lightbox {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.92); cursor: zoom-out;
    align-items: center; justify-content: center;
  }
  .cs-lightbox.open { display: flex; }
  .cs-lightbox img {
    max-width: 92vw; max-height: 92vh;
    object-fit: contain; border: 1px solid #333;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
  }
  .cs-zoomable { cursor: zoom-in; }
  .zoom-tag {
    position: absolute; top: 10px; right: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 1.5px; color: #c4c4c4;
    background: rgba(10,10,10,0.78); padding: 5px 9px;
    border: 1px solid rgba(255,255,255,0.12);
    pointer-events: none; z-index: 5; user-select: none;
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="cs-lightbox" id="cs-lightbox" onclick="this.classList.remove('open')">
  <img id="cs-lightbox-img" src="" alt="zoomed" />
</div>
<script>
function csZoom(src) {
  document.getElementById('cs-lightbox-img').src = src;
  document.getElementById('cs-lightbox').classList.add('open');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') document.getElementById('cs-lightbox').classList.remove('open');
});
(function() {
  function decorate() {
    document.querySelectorAll('.cs-zoomable, .gx-zoomable').forEach(function(el) {
      if (el.dataset.zoomTagged) return;
      // If el is a container (not <img>), badge goes INSIDE el.
      // If el is the <img> itself, badge goes into its parent wrapper.
      var host = (el.tagName === 'IMG') ? el.parentNode : el;
      if (!host) return;
      if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
      var b = document.createElement('div');
      b.textContent = 'CLICK TO ZOOM ⤢';
      b.className = 'zoom-tag';
      host.appendChild(b);
      el.dataset.zoomTagged = '1';
    });
  }
  new MutationObserver(decorate).observe(document.body, { childList: true, subtree: true });
  decorate();
})();
</script>
